server:
  # Bound normal signed child tickets together with the remaining request headers.
  max-http-request-header-size: 32KB
  address: ${AGENT_BIND_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18082}
spring:
  mvc:
    async:
      # The servlet must outlive RunController's bounded 55-second observation writer.
      # Keep a finite timeout; reconnect reads PG facts and never replays the business call.
      request-timeout: 60s
  data:
    redis:
      host: ${AGENT_REDIS_HOST:127.0.0.1}
      port: ${AGENT_REDIS_PORT:26379}
      password: ${AGENT_REDIS_PASSWORD:}
  application:
    name: engine-runtime
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AGENT_DB_URL:jdbc:postgresql://127.0.0.1:25432/agent_platform_v12?currentSchema=engine}
    username: ${AGENT_DB_USER:agent_v12}
    password: ${AGENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
  flyway:
    default-schema: engine
    schemas: engine
    locations: classpath:db/migration
    create-schemas: true
    # 样例 V901 可能已在升级库执行，后续引擎结构迁移仍使用引擎版本段。
    out-of-order: true
agent:
  scheduler:
    # Local worker slots; distributed model/tool/assembly permits remain separate gates.
    interactive-workers: ${AGENT_INTERACTIVE_WORKERS:16}
    batch-workers: ${AGENT_BATCH_WORKERS:4}
    poll-ms: ${AGENT_SCHEDULER_POLL_MS:200}
    lease-ms: ${AGENT_SCHEDULER_LEASE_MS:90000}
    drain-ms: ${AGENT_SCHEDULER_DRAIN_MS:30000}
  stream:
    max-subscriptions: ${AGENT_STREAM_MAX_SUBSCRIPTIONS:256}
    buffer-bytes: ${AGENT_STREAM_BUFFER_BYTES:16777216}
  sse:
    # R-16（台账 §7.6b）：会话/任务事件 SSE 限流与背压（ChatSessions/Tasks 共用同一键）。
    # max-buffered-events：单连接未读积压上限——PG（事实源）即缓冲，进程内每批 ≤200 事件；
    #   超限判慢消费者主动断开并记审计行（SESSION_SSE/TASK_SSE_SLOW_CONSUMER_DISCONNECT），
    #   客户端以 Last-Event-ID 重连续读（seq 幂等去重，不重不漏）。
    # max-connections-per-principal：单主体（tenant+principal）会话 SSE 连接上限，超限拒绝
    #   新连接（429 SESSION_SSE_CONNECTION_LIMIT）并记审计行；既有连接不受影响。
    max-buffered-events: ${AGENT_SSE_MAX_BUFFERED_EVENTS:2000}
    max-connections-per-principal: ${AGENT_SSE_MAX_CONNECTIONS_PER_PRINCIPAL:50}
  tool:
    # PLAT-14 T14.2：工具输出注入模型上下文的字节上限（UTF-8 序列化字节数）。超限不静默
    # 截断、不整块塞给模型：替换为 OUTPUT_TOO_LARGE 可读错误（含实际大小与上限）；
    # 契约声明了分页（contract.pagination）的工具附分页元信息供模型带页参续拉。原始
    # 输出完整保留在调用事实/trace。默认 256KiB，低于 P2-11 的 550KB 场景。调参方式：
    # 调小即收紧（更快拒绝）、调大即放宽；置极大值等价关闭检查（不建议）。
    output-max-bytes: ${AGENT_TOOL_OUTPUT_MAX_BYTES:262144}
  security:
    jwt-secret: ${AGENT_JWT_SECRET}
    issuer: agent-platform-v12
    # EX-43 第二阶段 A 组（engine-runtime）：本服务在服务间信任链里的身份。
    # mode=iam 时它必须与 agent.security.authority.client-id、audience
    # （urn:agent-platform:service:engine）一致。IAM 客户端凭据只允许走 secret
    # 引用：环境变量 AGENT_SECRET_IAM_ENGINE_CLIENT（yml 只写 env:NAME）。
    service-id: engine
  services:
    app: ${AGENT_APP_URL:http://127.0.0.1:18081}
    engine: ${AGENT_ENGINE_URL:http://127.0.0.1:18082}
    skill: ${AGENT_SKILL_URL:http://127.0.0.1:18083}
    model: ${AGENT_MODEL_URL:http://127.0.0.1:18084}
    monitor: ${AGENT_MONITOR_URL:http://127.0.0.1:18085}
  ontology:
    # 未配置时启动不报错；声明了 config.ontology 的运行会在冻结阶段得到 503。
    base-url: ${AGENT_ONTOLOGY_URL:}
    # 只接受 vault:/env:AGENT_SECRET_* 引用；env 引用必须显式绑定验签租户，密钥值不得进入 yml 或日志。
    api-key-ref: ${AGENT_ONTOLOGY_API_KEY_REF:}
  pin:
    # 运行期按发布绑定解析 releaseId。关闭即回滚为"只有显式 releaseId 才注入"。
    resolution-enabled: ${AGENT_PIN_RESOLUTION_ENABLED:true}
    # 查询哪份发布绑定：与发布时写入的 environment 必须一致。
    environment: ${AGENT_PIN_ENVIRONMENT:production}
  engine:
    # PLAT-19 T19.1（X-6 缩水版）：tenant/app/credential 三级 token 滑动窗口配额。
    # 默认关闭；上限 0=该级不限，开启后须显式配置上限。回滚：置 false 即整体旁路
    # （V223 只增索引，无需回滚）；聚合读路径 /admin/usage/summary 为纯只读，不受此开关控制。
    quota-enabled: ${AGENT_ENGINE_QUOTA_ENABLED:false}
    quota:
      window-seconds: ${AGENT_ENGINE_QUOTA_WINDOW_SECONDS:3600}
      tenant-tokens: ${AGENT_ENGINE_QUOTA_TENANT_TOKENS:0}
      app-tokens: ${AGENT_ENGINE_QUOTA_APP_TOKENS:0}
      credential-tokens: ${AGENT_ENGINE_QUOTA_CREDENTIAL_TOKENS:0}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
logging:
  level:
    org.springframework.security: WARN
