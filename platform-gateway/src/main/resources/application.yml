server:
  address: ${AGENT_BIND_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18080}
spring:
  application:
    name: platform-gateway
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # 网关只做字节流转发，绝不解析 multipart；否则上游收不到 part 边界。
      enabled: false
  datasource:
    url: ${AGENT_DB_URL:jdbc:postgresql://127.0.0.1:25432/agent_platform_v12?currentSchema=gateway}
    username: ${AGENT_DB_USER:agent_v12}
    password: ${AGENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
  flyway:
    default-schema: gateway
    schemas: gateway
    locations: classpath:db/migration
    create-schemas: true
agent:
  dev-auth: ${AGENT_DEV_AUTH:false}
  security:
    allow-embed: true
    jwt-secret: ${AGENT_JWT_SECRET}
    issuer: agent-platform-v12
  integration:
    # T18.1 业务入口限流：按集成凭据滑动窗口计数；默认关闭（回滚=恢复 false），max-requests<=0 表示不限。
    rate-limit-enabled: ${AGENT_INTEGRATION_RATE_LIMIT_ENABLED:false}
    rate-limit:
      window-seconds: ${AGENT_INTEGRATION_RATE_LIMIT_WINDOW_SECONDS:60}
      max-requests: ${AGENT_INTEGRATION_RATE_LIMIT_MAX_REQUESTS:0}
  services:
    app: ${AGENT_APP_URL:http://127.0.0.1:18081}
    engine: ${AGENT_ENGINE_URL:http://127.0.0.1:18082}
    skill: ${AGENT_SKILL_URL:http://127.0.0.1:18083}
    model: ${AGENT_MODEL_URL:http://127.0.0.1:18084}
    monitor: ${AGENT_MONITOR_URL:http://127.0.0.1:18085}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
logging:
  level:
    org.springframework.security: WARN

springdoc:
  api-docs:
    enabled: false

