server:
  address: ${AGENT_BIND_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18081}
spring:
  application:
    name: app-management
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AGENT_DB_URL:jdbc:postgresql://127.0.0.1:25432/agent_platform_v12?currentSchema=app}
    username: ${AGENT_DB_USER:agent_v12}
    password: ${AGENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
  flyway:
    default-schema: app
    schemas: app
    locations: classpath:db/migration
    create-schemas: true
agent:
  security:
    jwt-secret: ${AGENT_JWT_SECRET}
    issuer: agent-platform-v12
    # EX-43 第二阶段 A 组（app-management）：本服务在服务间信任链里的身份。
    # mode=iam 时它必须与 agent.security.authority.client-id、audience
    # （urn:agent-platform:service:app）一致，否则启动即 IAM_CLIENT_SERVICE_MISMATCH /
    # IAM_AUDIENCE_INVALID。IAM 客户端凭据只允许走 secret 引用：环境变量
    # AGENT_SECRET_IAM_APP_CLIENT（yml 只写 env:NAME，不写死密钥）。
    service-id: app
  services:
    app: ${AGENT_APP_URL:http://127.0.0.1:18081}
    engine: ${AGENT_ENGINE_URL:http://127.0.0.1:18082}
    skill: ${AGENT_SKILL_URL:http://127.0.0.1:18083}
    model: ${AGENT_MODEL_URL:http://127.0.0.1:18084}
    monitor: ${AGENT_MONITOR_URL:http://127.0.0.1:18085}
  system:
    redis-address: ${AGENT_SYSTEM_REDIS_ADDRESS:127.0.0.1:26379}
  ontology:
    # 未配置时发布绑定记 DISABLED：不发请求、不阻断发布。
    base-url: ${AGENT_ONTOLOGY_URL:}
    # 只接受 vault:/env: 引用；密钥值不得写入本文件或日志。
    api-key-ref: ${AGENT_ONTOLOGY_API_KEY_REF:}
  pin:
    # 回滚开关：false 时零网络副作用。
    enabled: ${AGENT_PIN_ENABLED:true}
    # true 时绑定失败拒绝本次发布响应（502 PIN_FAILED）；版本已提交，重放会再次尝试绑定。
    fail-closed: ${AGENT_PIN_FAIL_CLOSED:false}
    # T18.3 观测落库开关：false 只停写 app.publish_pin，发布响应与绑定行为不变。
    record-enabled: ${AGENT_PIN_RECORD_ENABLED:true}
    environment: ${AGENT_PIN_ENVIRONMENT:production}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
logging:
  level:
    org.springframework.security: WARN
