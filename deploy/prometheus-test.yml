global:
  scrape_interval: 15s
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["127.0.0.1:18888"]
  - job_name: platform-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "127.0.0.1:18090"
          - "127.0.0.1:18081"
          - "127.0.0.1:18082"
          - "127.0.0.1:18083"
          - "127.0.0.1:18084"
          - "127.0.0.1:18085"
