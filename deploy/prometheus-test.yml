global:
  scrape_interval: 15s
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["127.0.0.1:18888"]
  - job_name: platform-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "127.0.0.1:18180"
          - "127.0.0.1:18181"
          - "127.0.0.1:18182"
          - "127.0.0.1:18183"
          - "127.0.0.1:18184"
          - "127.0.0.1:18185"
