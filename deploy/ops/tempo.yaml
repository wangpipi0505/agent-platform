server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
storage:
  trace:
    backend: local
    wal:
      path: /tempo/wal
    local:
      path: /tempo/blocks
compactor:
  compaction:
    block_retention: 168h
usage_report:
  reporting_enabled: false
