      JAVA_TOOL_OPTIONS: -XX:+UseZGC -XX:+ZGenerational -XX:MaxRAMPercentage=70 -XX:MaxDirectMemorySize=128m
        -XX:+ExitOnOutOfMemoryError
      SERVER_SHUTDOWN: graceful
