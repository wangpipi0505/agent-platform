    cap_drop: *id002
    security_opt: *id003
    stop_grace_period: 60s
    tmpfs: *id004
    mem_limit: 1g
    cpus: 1.0
    env_file: *id005
    networks: *id006
    volumes: *id007
    image: ${SKILL_REGISTRY_IMAGE:?Explicit release image digest required}
    environment:
      AGENT_BIND_ADDRESS: 0.0.0.0
      SERVER_PORT: '8080'
      AGENT_DEV_AUTH: 'false'
