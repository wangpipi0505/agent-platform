name: agent-platform-v12-independent
services:
  platform-gateway:
    profiles: &id001
    - acceptance
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop: &id002
    - ALL
    security_opt: &id003
    - no-new-privileges:true
    stop_grace_period: 60s
    tmpfs: &id004
    - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=1770
    mem_limit: 1g
    cpus: 1.0
    env_file: &id005
    - ${AGENT_RUNTIME_ENV_FILE:?Explicit untracked acceptance secrets file required}
    networks: &id006
    - services
    - telemetry
    - dependencies
    volumes: &id007
    - vault:/var/lib/agent-vault
    image: ${PLATFORM_GATEWAY_IMAGE:?Explicit release image digest required}
    environment:
      AGENT_BIND_ADDRESS: 0.0.0.0
      SERVER_PORT: '8080'
      AGENT_DEV_AUTH: 'false'
      AGENT_RELEASE_GATE: ${AGENT_RELEASE_GATE:-BLOCKED_IAM_SCOPE_ACCEPTANCE}
      JAVA_TOOL_OPTIONS: -XX:+UseZGC -XX:+ZGenerational -XX:MaxRAMPercentage=70 -XX:MaxDirectMemorySize=128m
        -XX:+ExitOnOutOfMemoryError
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 45s
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: 'true'
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ADD_ADDITIONAL_PATHS: 'true'
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
      AGENT_SECRET_DIR: /var/lib/agent-vault
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS: ''
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_RESPONSE_HEADERS: ''
      OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_REQUEST_HEADERS: ''
      OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_RESPONSE_HEADERS: ''
      OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED: 'true'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
      AGENT_GATEWAY_URL: http://platform-gateway:8080
      AGENT_APP_URL: http://app-management:8080
      AGENT_ENGINE_URL: http://engine-runtime:8080
      AGENT_SKILL_URL: http://skill-registry:8080
      AGENT_MODEL_URL: http://model-gateway:8080
      AGENT_MONITOR_URL: http://monitor:8080
      AGENT_DB_URL: ${AGENT_DB_JDBC_BASE:?Dedicated PostgreSQL JDBC URL without query
        required}?currentSchema=gateway
      OTEL_SERVICE_NAME: platform-gateway
  app-management:
    profiles: *id001
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop: *id002
    security_opt: *id003
    stop_grace_period: 60s
