      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: 'true'
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ADD_ADDITIONAL_PATHS: 'true'
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
      AGENT_SECRET_DIR: /var/lib/agent-vault
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS: ''
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_RESPONSE_HEADERS: ''
      OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_REQUEST_HEADERS: ''
      OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_RESPONSE_HEADERS: ''
      OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED: 'true'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
      AGENT_GATEWAY_URL: http://platform-gateway:8080
      AGENT_APP_URL: http://app-management:8080
      AGENT_ENGINE_URL: http://engine-runtime:8080
      AGENT_SKILL_URL: http://skill-registry:8080
      AGENT_MODEL_URL: http://model-gateway:8080
      AGENT_MONITOR_URL: http://monitor:8080
      AGENT_DB_URL: ${AGENT_DB_JDBC_BASE:?Dedicated PostgreSQL JDBC URL without query
        required}?currentSchema=engine
      OTEL_SERVICE_NAME: engine-runtime
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
        reservations:
          memory: 512m
          cpus: '0.25'
  skill-registry:
    profiles: *id001
