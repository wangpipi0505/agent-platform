pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # URL query strings and headers may contain user data; do not write access logs.
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 10m;
    location = /healthz { default_type text/plain; return 200 'ok'; }
    location = / { return 302 /console/; }
    location = /console { return 302 /console/; }
    location ^~ /console/ { try_files $uri /console/index.html; }
    location /w/ { try_files $uri /w/index.html; }
    location = /assistant.js { add_header Cache-Control 'no-cache'; try_files $uri =404; }
    location /embed/ { add_header Cache-Control 'public, max-age=31536000, immutable'; try_files $uri =404; }
    # Actuator and internal APIs never transit the browser-facing proxy.
    location /actuator { return 404; }
    location /internal { return 404; }
    location = /auth/dev-token { return 404; }
    location ~ ^/(admin/|v1/|embed/ticket$|auth/) {
      proxy_pass http://platform-gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }
    location / { return 404; }
  }
}
