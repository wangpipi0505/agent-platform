apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- k8s/base.yaml
- k8s/ops.yaml
configMapGenerator:
- name: ops-config
  namespace: agent-platform-v12-ops
  files:
  - otel-collector.yaml=ops/otel-collector.yaml
  - prometheus.yaml=ops/prometheus.yaml
  - grafana-datasources.yaml=ops/grafana-datasources.yaml
  - loki.yaml=ops/loki.yaml
  - tempo.yaml=ops/tempo.yaml
generatorOptions:
  disableNameSuffixHash: true
