      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agent-platform-v12
      podSelector:
        matchLabels:
          tier: backend
    ports:
    - port: 8080
  egress:
  - to:
    - *id001
    ports:
    - port: 8080
---
apiVersion: networking.k8s.io/v1
