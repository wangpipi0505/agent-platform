apiVersion: v1
kind: Namespace
metadata:
  name: agent-platform-v12
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.33
    app.kubernetes.io/part-of: agent-platform-v12
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-platform-v12-ops
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.33
    app.kubernetes.io/part-of: agent-platform-v12
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-gate
  namespace: agent-platform-v12
data:
  AGENT_RELEASE_GATE: BLOCKED_IAM_SCOPE_ACCEPTANCE
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-platform
  namespace: agent-platform-v12
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: agent-platform-v12
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-dns
  namespace: agent-platform-v12
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
