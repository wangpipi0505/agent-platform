apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-internal
  namespace: agent-platform-v12-ops
spec:
  podSelector:
    matchLabels:
      tier: ops
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - &id001
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agent-platform-v12-ops
      podSelector:
        matchLabels:
          tier: ops
    ports:
    - port: 3000
    - port: 9090
    - port: 3100
    - port: 3200
    - port: 4317
    - port: 8889
  egress:
  - to:
    - *id001
    ports:
    - port: 3000
    - port: 9090
    - port: 3100
    - port: 3200
    - port: 4317
    - port: 8889
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: receive-application-otlp
  namespace: agent-platform-v12-ops
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agent-platform-v12
      podSelector:
        matchLabels:
          tier: backend
    ports:
    - port: 4317
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operations-grafana-only
  namespace: agent-platform-v12-ops
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          agent-platform.access: operations
      podSelector:
        matchLabels:
          agent-platform.ops-client: 'true'
    ports:
    - port: 3000
