<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>统计与生命周期组件验证</title></head><body><div id="app"></div><script type="module">
import {createApp,h} from 'vue';import {createPinia} from 'pinia';import ElementPlus from 'element-plus';import 'element-plus/dist/index.css';import '../shared/tokens.css';import App from '../admin/src/App.vue';import SkillStatistics from '../admin/src/SkillStatistics.vue';import {useAuth} from '../shared/api';
const params=new URLSearchParams(location.search);const app=createApp(params.has('skill')?{render:()=>h(SkillStatistics,{code:'lookup',versions:[{versionNo:1},{versionNo:2}]})}:App);app.use(createPinia());app.use(ElementPlus);const auth=useAuth();auth.token='component-fixture-only';auth.roles=params.has('reader')?['READER']:['ADMIN'];app.directive('permission',{mounted(el,binding){if(!auth.can(binding.value))el.remove();}});app.mount('#app');
