server:
  address: ${AGENT_BIND_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18082}
spring:
  mvc:
    async:
      # The servlet must outlive RunController's bounded 55-second observation writer.
      # Keep a finite timeout; reconnect reads PG facts and never replays the business call.
      request-timeout: 60s
  data:
    redis:
      host: ${AGENT_REDIS_HOST:127.0.0.1}
      port: ${AGENT_REDIS_PORT:26379}
      password: ${AGENT_REDIS_PASSWORD:}
  application:
    name: engine-runtime
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AGENT_DB_URL:jdbc:postgresql://127.0.0.1:25432/agent_platform_v12?currentSchema=engine}
    username: ${AGENT_DB_USER:agent_v12}
    password: ${AGENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
  flyway:
    default-schema: engine
    schemas: engine
    locations: classpath:db/migration
    create-schemas: true
agent:
  scheduler:
    # Local worker slots; distributed model/tool/assembly permits remain separate gates.
    interactive-workers: ${AGENT_INTERACTIVE_WORKERS:16}
    batch-workers: ${AGENT_BATCH_WORKERS:4}
    poll-ms: ${AGENT_SCHEDULER_POLL_MS:200}
    lease-ms: ${AGENT_SCHEDULER_LEASE_MS:90000}
    drain-ms: ${AGENT_SCHEDULER_DRAIN_MS:30000}
  stream:
    max-subscriptions: ${AGENT_STREAM_MAX_SUBSCRIPTIONS:256}
    buffer-bytes: ${AGENT_STREAM_BUFFER_BYTES:16777216}
  security:
    jwt-secret: ${AGENT_JWT_SECRET}
    issuer: agent-platform-v12
  services:
    app: ${AGENT_APP_URL:http://127.0.0.1:18081}
    engine: ${AGENT_ENGINE_URL:http://127.0.0.1:18082}
    skill: ${AGENT_SKILL_URL:http://127.0.0.1:18083}
    model: ${AGENT_MODEL_URL:http://127.0.0.1:18084}
    monitor: ${AGENT_MONITOR_URL:http://127.0.0.1:18085}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
logging:
  level:
    org.springframework.security: WARN
