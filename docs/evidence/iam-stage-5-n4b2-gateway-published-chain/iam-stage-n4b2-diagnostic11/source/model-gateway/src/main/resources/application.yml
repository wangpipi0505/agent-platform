server:
  address: ${AGENT_BIND_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18084}
spring:
  data:
    redis:
      host: ${AGENT_REDIS_HOST:127.0.0.1}
      port: ${AGENT_REDIS_PORT:26379}
      password: ${AGENT_REDIS_PASSWORD:}
      connect-timeout: 1s
      timeout: 1s
  application:
    name: model-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AGENT_DB_URL:jdbc:postgresql://127.0.0.1:25432/agent_platform_v12?currentSchema=model}
    username: ${AGENT_DB_USER:agent_v12}
    password: ${AGENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
  flyway:
    default-schema: model
    schemas: model
    locations: classpath:db/migration
    create-schemas: true
agent:
  security:
    jwt-secret: ${AGENT_JWT_SECRET}
    issuer: agent-platform-v12
  services:
    app: ${AGENT_APP_URL:http://127.0.0.1:18081}
    engine: ${AGENT_ENGINE_URL:http://127.0.0.1:18082}
    skill: ${AGENT_SKILL_URL:http://127.0.0.1:18083}
    model: ${AGENT_MODEL_URL:http://127.0.0.1:18084}
    monitor: ${AGENT_MONITOR_URL:http://127.0.0.1:18085}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
logging:
  level:
    org.springframework.security: WARN
