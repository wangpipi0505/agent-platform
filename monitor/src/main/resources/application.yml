server:
  address: ${AGENT_BIND_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18085}
spring:
  application:
    name: monitor
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AGENT_DB_URL:jdbc:postgresql://127.0.0.1:25432/agent_platform_v12?currentSchema=monitor}
    username: ${AGENT_DB_USER:agent_v12}
    password: ${AGENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
  flyway:
    default-schema: monitor
    schemas: monitor
    locations: classpath:db/migration
    create-schemas: true
agent:
  security:
    mode: ${AGENT_SECURITY_MODE:}
    # EX-43 phase 2 group B: catalog identity for the iam trust chain.
    service-id: ${AGENT_SECURITY_SERVICEID:monitor}
    jwt-secret: ${AGENT_JWT_SECRET}
    authority:
      issuer: ${AGENT_IAM_ISSUER:}
      jwks-uri: ${AGENT_IAM_JWKS_URI:}
      token-uri: ${AGENT_IAM_TOKEN_URI:}
      decision-uri: ${AGENT_IAM_DECISION_URI:}
      client-id: monitor
      client-secret-ref: env:AGENT_SECRET_IAM_MONITOR_CLIENT
      allowed-algorithm: RS256
      audience: urn:agent-platform:service:monitor
    issuer: agent-platform-v12
  services:
    app: ${AGENT_APP_URL:http://127.0.0.1:18081}
    engine: ${AGENT_ENGINE_URL:http://127.0.0.1:18082}
    skill: ${AGENT_SKILL_URL:http://127.0.0.1:18083}
    model: ${AGENT_MODEL_URL:http://127.0.0.1:18084}
    monitor: ${AGENT_MONITOR_URL:http://127.0.0.1:18085}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
logging:
  level:
    org.springframework.security: WARN
